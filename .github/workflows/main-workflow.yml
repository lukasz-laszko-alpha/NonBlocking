name: main-workflow

# Builds, tests and packs the Alc.NonBlocking library, then publishes the
# resulting NuGet package to Alphalab's GitHub Packages feed.
#
# Runs on the hybrid cluster regular-sized runner profile (actions-runners-hybrid:
# 4 CPU / 16 GB) inside the alc-build-tools build image, following the alc-nexus
# conventions (ECR login via OIDC, container credentials from the login outputs).
on:
  push:
    branches:
      - main
  workflow_dispatch: # for manual execution

permissions:
  id-token: write
  contents: read
  packages: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
  # Roll net8.0 test target forward onto the net10 runtime shipped in the image.
  DOTNET_ROLL_FORWARD: LatestMajor
  # Alphalab's NuGet (GitHub Packages, org: alphalab-hq)
  NUGET_FEED: https://nuget.pkg.github.com/alphalab-hq/index.json

jobs:
  init:
    runs-on: actions-runners-hybrid
    outputs:
      version: ${{ steps.setup.outputs.version }}
    steps:
      - name: Setup
        id: setup
        # Versioning scheme mirrors alc-nexus: 1.<YYYY.M>.<run_number>-<short_sha>
        run: |
          DATE=$(date +'%Y.%-m')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=1.${DATE}.${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  ecr-login:
    runs-on: actions-runners-hybrid
    outputs:
      docker_username: ${{ steps.login-ecr.outputs.docker_username_346086605621_dkr_ecr_ap_southeast_1_amazonaws_com }}
      docker_password: ${{ steps.login-ecr.outputs.docker_password_346086605621_dkr_ecr_ap_southeast_1_amazonaws_com }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::346086605621:role/github-oidc-deployer
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "346086605621"
          mask-password: "false"

  publish:
    needs: [init, ecr-login]
    runs-on: actions-runners-hybrid
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.init.outputs.version }}
    container:
      image: "346086605621.dkr.ecr.ap-southeast-1.amazonaws.com/alc-build-tools:dotnet10.0-debian12-292b68e"
      credentials:
        username: ${{ needs.ecr-login.outputs.docker_username }}
        password: ${{ needs.ecr-login.outputs.docker_password }}
      options: --user 1001:1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore NonBlocking.sln

      - name: Build
        run: dotnet build NonBlocking.sln -c Release --no-restore

      - name: Test
        run: dotnet test NonBlocking.sln -c Release --no-build

      - name: Pack
        run: >
          dotnet pack src/NonBlocking/NonBlocking.csproj
          -c Release --no-build
          -p:PackageVersion=$VERSION
          -o "$GITHUB_WORKSPACE/artifacts"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ${{ github.workspace }}/artifacts/*.nupkg

      - name: Push to Alphalab NuGet
        run: >
          dotnet nuget push "$GITHUB_WORKSPACE/artifacts/*.nupkg"
          --source "$NUGET_FEED"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: Summary
        run: |
          {
            echo "## Alc.NonBlocking package published"
            echo ""
            echo "| Package | Version | Feed |"
            echo "|---------|---------|------|"
            echo "| Alc.NonBlocking | \`$VERSION\` | $NUGET_FEED |"
          } >> "$GITHUB_STEP_SUMMARY"
